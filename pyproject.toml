[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a11yviz"
version = "0.1.2"
description = "Accessibility toolkit for plotnine, plotly, and Quarto Python documents (WCAG 2.1 AA)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mikyung Shin", email = "shin.mikyung@gmail.com" }]
keywords = ["accessibility", "wcag", "plotly", "quarto", "a11y"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.optional-dependencies]
plotly = ["plotly>=5.0"]
plotnine = ["plotnine>=0.13"]
test = ["pytest>=7", "plotly>=5.0", "plotnine>=0.13"]

[project.urls]
Homepage = "https://github.com/mshin77/a11yviz-py"
Issues = "https://github.com/mshin77/a11yviz-py/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a11yviz = ["data/*.css"]
